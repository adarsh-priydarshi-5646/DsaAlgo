name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sundays

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Audit Frontend
      run: |
        cd frontend
        npm audit --audit-level=high || true # Don't fail build yet, just report

    - name: Audit Backend
      run: |
        cd backend
        npm audit --audit-level=high || true # Don't fail build yet, just report
