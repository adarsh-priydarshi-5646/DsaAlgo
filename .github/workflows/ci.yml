name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    # Frontend Build & Lint
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint -- --max-warnings 10 || true
    
    - name: Run Frontend Tests
      run: |
        cd frontend
        npm run test
    
    # Backend Build & Validate
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Validate Prisma Schema
      env:
        DIRECT_URL: ''
      run: |
        cd backend
        npx prisma validate

    - name: Check Server Syntax
      run: |
        cd backend
        node -c server.js
